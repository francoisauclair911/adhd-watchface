<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADHD Watchface Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 0 0 40px;
    }

    header {
      background: rgb(230, 110, 107);
      padding: 20px 20px 16px;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.03em;
    }
    header p {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      margin-top: 4px;
    }

    .section {
      margin: 20px 16px 0;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgb(230, 110, 107);
      margin-bottom: 8px;
    }
    .card {
      background: #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
    }
    .field {
      padding: 12px 14px;
      border-bottom: 1px solid #333;
    }
    .field:last-child { border-bottom: none; }
    .field label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 5px;
    }
    .field input[type="text"],
    .field input[type="number"],
    .field input[type="url"] {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f0f0f0;
      font-size: 15px;
      padding: 0;
    }
    .field input::placeholder { color: #555; }

    .header-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #333;
    }
    .header-row:last-child { border-bottom: none; }
    .header-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f0f0f0;
      font-size: 14px;
      min-width: 0;
    }
    .header-row input::placeholder { color: #555; }
    .header-row .sep {
      color: #555;
      font-size: 13px;
      flex-shrink: 0;
    }
    .header-row .remove-btn {
      background: none;
      border: none;
      color: #e05a5a;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
      padding: 0 2px;
    }

    .add-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: rgb(230, 110, 107);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 14px;
    }
    .add-btn::before { content: '+'; font-size: 18px; line-height: 1; }

    .save-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 24px 16px 0;
      background: rgb(230, 110, 107);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .save-btn:active { opacity: 0.85; }

    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      padding: 0 4px;
    }
  </style>
</head>
<body>

<header>
  <h1>ADHD Watchface</h1>
  <p>Configure your data source</p>
</header>

<div class="section">
  <div class="section-title">Endpoint</div>
  <div class="card">
    <div class="field">
      <label>URL</label>
      <input type="url" id="url" placeholder="https://api.example.com/status" />
    </div>
    <div class="field">
      <label>JSON key path</label>
      <input type="text" id="textPath" placeholder="message" />
    </div>
  </div>
  <p class="hint">Dot notation supported, e.g. <code>data.status.text</code></p>
</div>

<div class="section">
  <div class="section-title">Polling</div>
  <div class="card">
    <div class="field">
      <label>Interval (seconds)</label>
      <input type="number" id="pollSec" min="10" max="3600" placeholder="180" />
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Headers</div>
  <div class="card" id="headers-card">
    <!-- header rows injected here -->
  </div>
  <button class="add-btn" id="add-header-btn">Add Header</button>
</div>

<button class="save-btn" id="save-btn">Save</button>

<script>
  var settings = { url: '', textPath: 'message', pollSec: 180, headers: [] };

  try {
    var raw = location.search.slice(1);
    var params = {};
    raw.split('&').forEach(function(p) {
      var idx = p.indexOf('=');
      if (idx > -1) params[decodeURIComponent(p.slice(0, idx))] = decodeURIComponent(p.slice(idx + 1));
    });
    if (params.settings) {
      var parsed = JSON.parse(params.settings);
      if (parsed.url)      settings.url      = parsed.url;
      if (parsed.textPath) settings.textPath = parsed.textPath;
      if (parsed.pollSec)  settings.pollSec  = parsed.pollSec;
      if (Array.isArray(parsed.headers)) settings.headers = parsed.headers;
    }
  } catch (e) {}

  document.getElementById('url').value      = settings.url;
  document.getElementById('textPath').value = settings.textPath;
  document.getElementById('pollSec').value  = settings.pollSec;

  var headersCard = document.getElementById('headers-card');

  function addHeaderRow(key, value) {
    var row = document.createElement('div');
    row.className = 'header-row';
    row.innerHTML =
      '<input type="text" class="hkey" placeholder="Authorization" value="' + escAttr(key || '') + '" />' +
      '<span class="sep">:</span>' +
      '<input type="text" class="hval" placeholder="Bearer token" value="' + escAttr(value || '') + '" />' +
      '<button class="remove-btn" title="Remove">&times;</button>';
    row.querySelector('.remove-btn').addEventListener('click', function() {
      headersCard.removeChild(row);
    });
    headersCard.appendChild(row);
  }

  function escAttr(s) {
    return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  settings.headers.forEach(function(h) { addHeaderRow(h.key, h.value); });

  document.getElementById('add-header-btn').addEventListener('click', function() {
    addHeaderRow('', '');
  });

  document.getElementById('save-btn').addEventListener('click', function() {
    var headers = [];
    headersCard.querySelectorAll('.header-row').forEach(function(row) {
      var k = row.querySelector('.hkey').value.trim();
      var v = row.querySelector('.hval').value.trim();
      if (k) headers.push({ key: k, value: v });
    });

    var result = {
      url:      document.getElementById('url').value.trim(),
      textPath: document.getElementById('textPath').value.trim() || 'message',
      pollSec:  parseInt(document.getElementById('pollSec').value, 10) || 180,
      headers:  headers
    };

    var encoded = encodeURIComponent(JSON.stringify(result));
    document.location = 'pebblejs://close#' + encoded;
  });
</script>
</body>
</html>
